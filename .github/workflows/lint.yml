name: lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 结构校验
        run: python3 tools/lint.py
      - name: 工具单测
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
